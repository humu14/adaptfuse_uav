# Core experiment 1/2: deployment-oriented pretrained baseline.
experiment_name: "efficient_yolov10n_baseline"
output_dir: "outputs/efficient_study"

model:
  architecture: "yolov10n"
  pretrained: true
  num_classes: 2

dataset:
  name: "dfire"
  root: "data/datasets/dfire"
  image_size: 512

training:
  epochs: 40
  batch_size: 16
  optimizer: "AdamW"
  lr: 0.001
  warmup_epochs: 2
  early_stopping_patience: 8
  cache: "disk"
  close_mosaic: 5
  cos_lr: true
  save_period: -1

evaluation:
  run_test_after_training: true
  map_conf_threshold: 0.001
  nms_iou_threshold: 0.7
