# Optional diagnostic: retain boundary detail, remove fire/smoke colour priors.
experiment_name: "ablation_hpg_no_spectral"
output_dir: "outputs/efficient_study"

model:
  architecture: "hazard_yolo26n"
  pretrained: true
  num_classes: 2
  hazard_prior_gate:
    hidden_channels: 16
    use_fire_prior: false
    use_smoke_prior: false
    use_detail_prior: true
    max_residual: 0.25
    gate_stride: 4

dataset:
  root: "data/datasets/dfire"
  image_size: 512

training:
  epochs: 15
  batch_size: 16
  early_stopping_patience: 5
  warmup_epochs: 1
  cache: "disk"
  close_mosaic: 3

evaluation:
  run_test_after_training: false
