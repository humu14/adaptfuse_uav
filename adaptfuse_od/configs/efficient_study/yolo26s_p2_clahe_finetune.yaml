# Controlled small-object experiment. Previous runs are never overwritten.
experiment_name: "accuracy_yolo26s_p2_clahe_640"
output_dir: "outputs/accuracy_study"

model:
  architecture: "yolo26s_p2"
  cfg: "models/yolo_variants/yolo26s_p2.yaml"
  pretrained: true
  weights: "outputs/accuracy_study/accuracy_yolo26s_clahe_640/weights/best.pt"
  num_classes: 2

dataset:
  name: "dfire_clahe"
  root: "data/datasets/dfire_clahe"
  class_names: ["smoke", "fire"]
  image_size: 640

training:
  epochs: 30
  # GTX 960 safety setting: batch 4 triggered an asynchronous CUDA illegal
  # memory access during epoch 11. Gradient accumulation keeps the nominal
  # batch normalization target while reducing peak device memory.
  batch_size: 2
  validation_batch_size: 1
  optimizer: "AdamW"
  lr: 0.0005
  min_lr: 0.000005
  weight_decay: 0.0001
  momentum: 0.937
  warmup_epochs: 1
  early_stopping_patience: 10
  num_workers: 2
  amp: true
  cache: "disk"
  close_mosaic: 5
  cos_lr: true
  save_period: 5

augmentation:
  mosaic: 0.2
  mixup: 0.0
  hsv_h: 0.01
  hsv_s: 0.4
  hsv_v: 0.2
  flip_lr: 0.5
  flip_ud: 0.0
  scale: 0.4
  translate: 0.1
  degrees: 0.0
  perspective: 0.0

evaluation:
  run_test_after_training: true
  batch_size: 2
  map_conf_threshold: 0.001
  nms_iou_threshold: 0.7
