# Fast accuracy gate: reuse the completed D-Fire model, then adapt it to the
# corrected CLAHE dataset and higher resolution. Run this before YOLO26s.
experiment_name: "accuracy_yolo26n_clahe_finetune_640"
output_dir: "outputs/accuracy_study"

model:
  architecture: "yolo26n"
  pretrained: true
  weights: "outputs/efficient_study/efficient_yolo26n_baseline/weights/best.pt"
  num_classes: 2

dataset:
  name: "dfire_clahe"
  root: "data/datasets/dfire_clahe"
  class_names: ["smoke", "fire"]
  image_size: 640

training:
  epochs: 20
  batch_size: 8
  validation_batch_size: 4
  optimizer: "AdamW"
  lr: 0.0005
  min_lr: 0.000005
  weight_decay: 0.0001
  momentum: 0.937
  warmup_epochs: 1
  early_stopping_patience: 8
  num_workers: 2
  amp: true
  cache: "disk"
  close_mosaic: 5
  cos_lr: true
  save_period: 5

augmentation:
  mosaic: 0.2
  mixup: 0.0
  hsv_h: 0.01
  hsv_s: 0.4
  hsv_v: 0.2
  flip_lr: 0.5
  flip_ud: 0.0
  scale: 0.4
  translate: 0.1
  degrees: 0.0
  perspective: 0.0

evaluation:
  run_test_after_training: true
  batch_size: 4
  map_conf_threshold: 0.001
  nms_iou_threshold: 0.7
