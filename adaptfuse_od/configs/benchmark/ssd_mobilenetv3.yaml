# SSD with MobileNetV3-Large backbone — Ultra-lightweight baseline
experiment_name: "benchmark_ssd_mobilenetv3"

model:
  architecture: "ssd_mobilenetv3"
  pretrained: true
  num_classes: 2

dataset:
  name: "dfire"
  image_size: 320

training:
  epochs: 100
  batch_size: 16
  lr: 0.01
  optimizer: "SGD"
  momentum: 0.9
  weight_decay: 0.0005
  early_stopping_patience: 20
