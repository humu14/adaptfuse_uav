model: baseline_rgb
experiment_name: public_aider_rgb_efficientnet
modalities: [rgb]
metadata_dir: data/metadata_public/aider_412
num_classes_disaster: 5
num_classes_victim: 2
rgb_backbone: efficientnet_b0

# Public-benchmark protocol run (AIDER 4:1:2 subset); same training pipeline as the main suite
batch_size: 8
epochs: 30
lr: 1e-3
weight_decay: 1e-4
use_focal_loss: true
use_balanced: false
use_balanced_half: false
use_kd: false
kd_teacher_ckpt: null
corruption_prob: 0.3
missing_modality_prob: 0.0
scheduler: CosineAnnealingLR
T_max: 30
min_lr: 1e-5
warmup_epochs: 3
num_workers: 4
seed: 42
device: cuda
output_dir: outputs/
early_stopping: true
early_stopping_patience: 10
