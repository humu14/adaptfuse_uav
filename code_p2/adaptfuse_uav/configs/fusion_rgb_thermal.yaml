model: adaptfuse_v1
modalities: [rgb, thermal]
num_classes_disaster: 4
num_classes_victim: 2
batch_size: 16
epochs: 50
lr: 1e-3
weight_decay: 1e-4
use_focal_loss: true
use_balanced: true
use_balanced_half: true
use_kd: false
kd_teacher_ckpt: null
corruption_prob: 0.3
missing_modality_prob: 0.0
scheduler: CosineAnnealingLR
T_max: 50
min_lr: 1e-5
warmup_epochs: 5
num_workers: 4
seed: 42
device: cuda
output_dir: outputs/
experiment_name: fusion_rgb_thermal
early_stopping: true
early_stopping_patience: 15
# Two-sensor: RGB + Thermal only (best visual pair, FLAME case)
