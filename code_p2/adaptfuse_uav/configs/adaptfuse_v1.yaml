model: adaptfuse_v1
modalities: [rgb, thermal, audio]
num_classes_disaster: 4
num_classes_victim: 2
batch_size: 16
epochs: 50
lr: 1e-3
weight_decay: 1e-4
use_focal_loss: true
use_balanced: true
use_balanced_half: true
use_kd: false
kd_teacher_ckpt: null
corruption_prob: 0.3
missing_modality_prob: 0.2
scheduler: CosineAnnealingLR
T_max: 50
min_lr: 1e-5
warmup_epochs: 5
num_workers: 4
seed: 42
device: cuda
output_dir: outputs/
experiment_name: adaptfuse_v1
early_stopping: true
early_stopping_patience: 15
