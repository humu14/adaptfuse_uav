# UniAdapFuse-UAV v2: Improved Unified Training Configuration
# ==========================================================
# Changes from v1:
#   1. Phased curriculum training (15 epochs cls-only, then joint)
#   2. Gradient isolation (detach_det_backbone: true)
#   3. Separate learning rates (backbone 0.1x, detection 0.3x)
#   4. Knowledge distillation from AdapFuse-v1 teacher
#   5. Increased training (80 epochs, patience 25)
#   6. Loss rebalancing (disaster 2.0x, det 0.2x)
#   7. Lower initial LR (5e-4 vs 1e-3) for stability

model: uni_adaptfuse
modalities: [rgb, thermal, audio]
num_classes_disaster: 4
num_classes_victim: 2
num_classes_det: 2
proj_dim: 192
det_neck_channels: 128
num_heads: 4
dropout: 0.3
pretrained: true

# ── Gradient Isolation ──────────────────────────────────────
detach_det_backbone: true

# ── Phased Curriculum Training ──────────────────────────────
phase1_epochs: 15   # Epochs 1-15: classification-only (det frozen)

# ── Separate Learning Rates ────────────────────────────────
backbone_lr_mult: 0.1   # Backbone gets 0.1x base LR
det_lr_mult: 0.3         # Detection stream gets 0.3x base LR

# ── Knowledge Distillation ──────────────────────────────────
use_kd: true
kd_teacher_ckpt: outputs/checkpoints/adaptfuse_v1_best.pth

# ── Training Hyperparameters ────────────────────────────────
batch_size: 16
epochs: 80
lr: 5e-4
weight_decay: 1e-4

# ── Loss Weights ────────────────────────────────────────────
disaster_weight: 2.0
victim_weight: 0.5
nuisance_weight: 0.3
det_weight: 0.2

# ── Focal Loss ──────────────────────────────────────────────
use_edl: true
use_focal_loss: true
use_balanced: true
use_balanced_half: true

# ── Data Augmentation ───────────────────────────────────────
corruption_prob: 0.3
missing_modality_prob: 0.2

# ── Scheduler ───────────────────────────────────────────────
scheduler: CosineAnnealingLR
T_max: 80
min_lr: 1e-5
warmup_epochs: 5

# ── Infrastructure ──────────────────────────────────────────
num_workers: 4
seed: 42
device: cuda
output_dir: outputs/
experiment_name: uni_adaptfuse_v2
early_stopping: true
early_stopping_patience: 25
