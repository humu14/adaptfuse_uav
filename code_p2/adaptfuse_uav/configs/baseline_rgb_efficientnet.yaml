model: baseline_rgb
experiment_name: baseline_rgb_efficientnet
modalities: [rgb]
num_classes_disaster: 4
num_classes_victim: 2

# Unimodal backbone sweep: RGB-only EfficientNet-B0 (12-epoch budget)
rgb_backbone: efficientnet_b0

batch_size: 8
epochs: 12
lr: 1e-3
weight_decay: 1e-4
use_focal_loss: true
use_balanced: true
use_balanced_half: true
use_kd: false
kd_teacher_ckpt: null
corruption_prob: 0.3
missing_modality_prob: 0.0
scheduler: CosineAnnealingLR
T_max: 12
min_lr: 1e-5
warmup_epochs: 2
num_workers: 4
seed: 42
device: cuda
output_dir: outputs/
early_stopping: true
early_stopping_patience: 5
