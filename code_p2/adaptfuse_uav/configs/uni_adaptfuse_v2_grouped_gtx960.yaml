# GTX-960 diagnostic configuration for the unified scene + detection model.
# Run the short validation-mAP gate in EXPERIMENT_RUNBOOK.md before any full suite.
model: uni_adaptfuse
modalities: [rgb, thermal, audio]
num_classes_disaster: 4
num_classes_victim: 2
num_classes_det: 2
proj_dim: 192
det_neck_channels: 128
num_heads: 4
dropout: 0.3
pretrained: true

detach_det_backbone: true
phase1_epochs: 15
backbone_lr_mult: 0.1
det_lr_mult: 0.3

# Keep the detector-repair gate independent of a projection-dimension-matched teacher.
use_kd: false
kd_teacher_ckpt: null

batch_size: 1
epochs: 80
lr: 5e-4
weight_decay: 1e-4
disaster_weight: 2.0
victim_weight: 0.5
nuisance_weight: 0.3
det_weight: 0.2
use_edl: true
use_focal_loss: true
use_balanced: false
use_balanced_half: false
corruption_prob: 0.0
missing_modality_prob: 0.2
scheduler: CosineAnnealingLR
T_max: 80
min_lr: 1e-5
warmup_epochs: 5
num_workers: 0
audio_cache_dir: data/audio_cache/logmel_64x63
seed: 42
deterministic: true
device: cuda
output_dir: outputs/joint_detector_gtx960/
experiment_name: uni_adaptfuse_v2_grouped_gtx960
early_stopping: true
early_stopping_patience: 25
