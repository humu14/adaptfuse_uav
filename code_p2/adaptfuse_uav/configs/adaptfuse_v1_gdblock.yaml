model: adaptfuse_v1
experiment_name: adaptfuse_v1_gdblock
modalities: [rgb, thermal, audio]
num_classes_disaster: 4
num_classes_victim: 2

# EXP-18: GDBlock audio encoder (GlimmerNet-inspired multi-scale dilated CNN)
# Multi-scale dilated (d=1,3,5) convs + pointwise fusion.
# Same out_dim=128 as AudioCNN — drop-in replacement for projectors.
# Citable: "audio encoder draws from GlimmerNet GDBlock design principle"
audio_backbone: audiocnn_gd
rgb_backbone: mobilenet_v3_small
thermal_backbone: resnet18

batch_size: 16
epochs: 50
lr: 1e-3
weight_decay: 1e-4
use_focal_loss: true
use_balanced: true
use_balanced_half: true
use_kd: false
kd_teacher_ckpt: null
corruption_prob: 0.3
missing_modality_prob: 0.2
scheduler: CosineAnnealingLR
T_max: 50
min_lr: 1e-5
warmup_epochs: 5
num_workers: 4
seed: 42
device: cuda
output_dir: outputs/
early_stopping: true
early_stopping_patience: 15
