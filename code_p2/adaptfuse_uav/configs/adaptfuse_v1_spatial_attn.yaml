model: adaptfuse_v1
experiment_name: adaptfuse_v1_spatial_attn
modalities: [rgb, thermal, audio]
num_classes_disaster: 4
num_classes_victim: 2

# EXP-22: CBAM-style spatial alignment attention before GAP
# Applied to both RGB (576ch) and Thermal (512ch) backbones.
# ~50K extra params per backbone (negligible).
# Expected: +1-2% under smoke/thermal corruption (spatial disagreement highest)
use_spatial_attn: true
rgb_backbone: mobilenet_v3_small
thermal_backbone: resnet18
audio_backbone: audiocnn

batch_size: 16
epochs: 50
lr: 1e-3
weight_decay: 1e-4
use_focal_loss: true
use_balanced: true
use_balanced_half: true
use_kd: false
kd_teacher_ckpt: null
corruption_prob: 0.3
missing_modality_prob: 0.2
scheduler: CosineAnnealingLR
T_max: 50
min_lr: 1e-5
warmup_epochs: 5
num_workers: 4
seed: 42
device: cuda
output_dir: outputs/
early_stopping: true
early_stopping_patience: 15
