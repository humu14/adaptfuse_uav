model: adaptfuse_v1
experiment_name: adaptfuse_v1_efficientnet_thermal
modalities: [rgb, thermal, audio]
num_classes_disaster: 4
num_classes_victim: 2

# EXP-16: EfficientNet-B0 thermal backbone (1-channel adapted)
# Symmetric with EXP-15. ResNet18(512d) -> EfficientNet-B0(1280d)
# Makes RGB+Thermal backbones symmetric — cleaner ablation analysis
thermal_backbone: efficientnet_b0
rgb_backbone: mobilenet_v3_small
audio_backbone: audiocnn
proj_dim: 256

batch_size: 8
epochs: 50
lr: 1e-3
weight_decay: 1e-4
use_focal_loss: true
use_balanced: true
use_balanced_half: true
use_kd: false
kd_teacher_ckpt: null
corruption_prob: 0.3
missing_modality_prob: 0.2
scheduler: CosineAnnealingLR
T_max: 50
min_lr: 1e-5
warmup_epochs: 5
num_workers: 4
seed: 42
device: cuda
output_dir: outputs/
early_stopping: true
early_stopping_patience: 15
