# Matched grouped-split ablation: identical to adaptfuse_v1_grouped_gtx960.yaml
# except that RUE is disabled and the experiment/output names are distinct.
model: adaptfuse_v1
modalities: [rgb, thermal, audio]
num_classes_disaster: 4
num_classes_victim: 2
batch_size: 2
epochs: 50
lr: 1e-3
weight_decay: 1e-4
use_focal_loss: true
use_balanced: false
use_balanced_half: false
use_kd: false
kd_teacher_ckpt: null
corruption_prob: 0.0
missing_modality_prob: 0.2
scheduler: CosineAnnealingLR
T_max: 50
min_lr: 1e-5
warmup_epochs: 5
num_workers: 0
audio_cache_dir: data/audio_cache/logmel_64x63
seed: 42
deterministic: true
device: cuda
output_dir: outputs/grouped_no_rue/
experiment_name: adaptfuse_v1_grouped_no_rue
early_stopping: true
early_stopping_patience: 15
use_rue: false
use_quality_tokens: true
use_cross_attn: true
use_gru: true
use_nuisance: true
