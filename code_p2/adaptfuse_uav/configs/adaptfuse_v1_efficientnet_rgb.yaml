model: adaptfuse_v1
experiment_name: adaptfuse_v1_efficientnet_rgb
modalities: [rgb, thermal, audio]
num_classes_disaster: 4
num_classes_victim: 2

# EXP-15: EfficientNet-B0 RGB backbone
# 5.3M params, 1280d output (+11% ImageNet acc vs MobileNetV3-Small)
# proj_dim=256: larger proj to handle 1280->256 (vs 576->192 default)
# batch_size=8: conservative for 4GB VRAM with 1280d features
rgb_backbone: efficientnet_b0
thermal_backbone: resnet18
audio_backbone: audiocnn
proj_dim: 256

batch_size: 8
epochs: 50
lr: 1e-3
weight_decay: 1e-4
use_focal_loss: true
use_balanced: true
use_balanced_half: true
use_kd: false
kd_teacher_ckpt: null
corruption_prob: 0.3
missing_modality_prob: 0.2
scheduler: CosineAnnealingLR
T_max: 50
min_lr: 1e-5
warmup_epochs: 5
num_workers: 4
seed: 42
device: cuda
output_dir: outputs/
early_stopping: true
early_stopping_patience: 15
